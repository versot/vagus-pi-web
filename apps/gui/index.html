<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vagusPI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236366f1%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238b5cf6%22/%3E%3C/linearGradient%3E%3C/defs%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22url%28%23g%29%22/%3E%0A%20%20%3Cpath%20d%3D%22M16%205.5L26.5%2016%2016%2026.5%205.5%2016Z%22%20fill%3D%22%23fff%22/%3E%0A%3C/svg%3E%0A" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #root { min-height: 100dvh; }
      /* Theme-aware scrollbars */
      [data-theme="dark"] ::-webkit-scrollbar { width: 6px; height: 6px; }
      [data-theme="dark"] ::-webkit-scrollbar-track { background: transparent; }
      [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 3px; }
      [data-theme="light"] ::-webkit-scrollbar { width: 6px; height: 6px; }
      [data-theme="light"] ::-webkit-scrollbar-track { background: transparent; }
      [data-theme="light"] ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
      input, button, textarea { font-family: inherit; }
      button:focus-visible { outline: 2px solid #4f8cff; outline-offset: 2px; }
      /* Queued-message waiting dot */
      @keyframes vagus-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes vagus-spin { to { transform: rotate(360deg); } }
      @keyframes vagus-breath { 0%, 100% { box-shadow: 0 6px 28px rgba(99,102,241,0.08), 0 0 0 0 rgba(99,102,241,0); border-color: rgba(99,102,241,0.2); } 50% { box-shadow: 0 6px 36px rgba(99,102,241,0.18), 0 0 0 3px rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.5); } }
      /* Extension-notify toast slide-up */
      @keyframes vagus-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      /* Sidebar marquee: single-direction seamless loop; content is doubled while hovered, -50% = exactly one copy+gap */
      @keyframes vagus-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .vagus-marquee:hover { text-overflow: clip; }
      /* Row hover hides the time label so the name window widens for scrolling */
      .vagus-session-row:hover .vagus-row-time { display: none; }
      /* Hide the history-nav rail's own scrollbar (ticks overflow internally) */
      .vagus-nav-scroll { scrollbar-width: none; -ms-overflow-style: none; }
      .vagus-nav-scroll::-webkit-scrollbar { display: none; }
      /* Show the revert button when hovering the user message row */
      .vagus-revert-btn { pointer-events: none; }
      div:hover > .vagus-revert-btn, .vagus-revert-btn:hover { opacity: 1 !important; pointer-events: auto; }
    </style>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
